<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ruang Informatika Kelas X</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: sticky top bar + single-page routes (hash). Cool-grey ground, one cyan accent,
   three lesson hues (blue / teal / amber). Faux device screens use their own --scr/--win tokens. */
:root{
  --bg:#F4F7FA; --surface:#FFFFFF; --surface-2:#EAF0F5; --ink:#0B1A28; --muted:#516579; --line:#D6E0E9;
  --accent:#0E7490; --accent-soft:#DDF1F6; --on-accent:#FFFFFF;
  --c1:#2563EB; --c2:#0F766E; --c3:#B45309;
  --ok:#15803D; --warn:#B45309; --bad:#B91C1C;
  --ok-soft:#E3F4E8; --warn-soft:#FBEFD9; --bad-soft:#FBE4E4;
  --scr:#0B2A4A; --scr-2:#123A63; --scr-ink:#EAF2FB; --scr-line:#2B5A8C; --scr-btn:#2B7CD3; --hit:#FBBF24;
  --win-bg:#F1F3F5; --win-ink:#1B1F24; --win-line:#CBD2D9; --win-sel:#CFE4FA; --bezel:#1B2A38;
  --shadow:0 1px 2px rgba(11,26,40,.05),0 10px 28px rgba(11,26,40,.07);
  --font-display:'Space Grotesk',system-ui,sans-serif; --font-body:'Inter',system-ui,sans-serif; --font-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#08121B; --surface:#0F1D2A; --surface-2:#14283A; --ink:#E7EEF5; --muted:#93A8BB; --line:#203649;
  --accent:#22D3EE; --accent-soft:#0E2E3B; --on-accent:#03202A;
  --c1:#60A5FA; --c2:#2DD4BF; --c3:#FBBF24;
  --ok:#4ADE80; --warn:#FBBF24; --bad:#F87171;
  --ok-soft:#10301E; --warn-soft:#33270E; --bad-soft:#3A1717;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08121B; --surface:#0F1D2A; --surface-2:#14283A; --ink:#E7EEF5; --muted:#93A8BB; --line:#203649;
  --accent:#22D3EE; --accent-soft:#0E2E3B; --on-accent:#03202A;
  --c1:#60A5FA; --c2:#2DD4BF; --c3:#FBBF24;
  --ok:#4ADE80; --warn:#FBBF24; --bad:#F87171;
  --ok-soft:#10301E; --warn-soft:#33270E; --bad-soft:#3A1717;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.65 var(--font-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
h1,h2,h3,h4{font-family:var(--font-display);line-height:1.18;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
code,kbd,.mono{font-family:var(--font-mono);font-size:.88em}
code{background:var(--surface-2);padding:.12em .4em;border-radius:5px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font:500 12px/1 var(--font-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:500;text-decoration:none;color:var(--ink);transition:transform .15s,border-color .15s,background .15s}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:18px;height:18px;flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:var(--surface-2);font-size:13px;color:var(--muted);white-space:nowrap}
.chip svg{width:14px;height:14px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;height:64px}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--ink);margin-right:auto;min-width:0}
.mark{width:38px;height:38px;border-radius:10px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font:700 15px/1 var(--font-display);letter-spacing:.02em;position:relative;flex:none}
.mark::after{content:"";position:absolute;right:-3px;bottom:-3px;width:11px;height:11px;border-radius:50%;background:var(--accent);border:2px solid var(--bg)}
.brand-t{display:flex;flex-direction:column;min-width:0}
.brand-t b{font:600 16px/1.2 var(--font-display)}
.brand-t small{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#nav{display:flex;gap:2px}
#nav a{padding:8px 12px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:500;font-size:15px;white-space:nowrap}
#nav a:hover{color:var(--ink);background:var(--surface-2)}
#nav a[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.icon-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.icon-btn svg{width:19px;height:19px}
#menuBtn{display:none}
@media (max-width:860px){
  #menuBtn{display:grid}
  #nav{position:absolute;left:0;right:0;top:100%;flex-direction:column;background:var(--bg);border-bottom:1px solid var(--line);padding:8px max(16px,env(safe-area-inset-left,0px)) 14px;display:none}
  #nav.open{display:flex}
  #nav a{padding:12px;font-size:16px}
}

/* generic sections */
.section{padding-block:56px}
.section-head{display:flex;flex-direction:column;gap:10px;margin-bottom:28px;max-width:640px}
.section-head h2{font-size:clamp(26px,3.4vw,36px)}
.section-head p{color:var(--muted)}

/* hero */
.hero{padding-block:48px 24px;background:radial-gradient(circle at 1px 1px,color-mix(in srgb,var(--muted) 22%,transparent) 1px,transparent 1.2px) 0 0/22px 22px}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:40px;align-items:center}
.hero h1{font-size:clamp(34px,5.2vw,58px);font-weight:700;margin:16px 0 18px}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero .lead{font-size:18px;color:var(--muted);max-width:520px}
.hero-cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.hero-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}
.hero-art{width:100%;height:auto;max-width:520px;justify-self:center}
@media (max-width:860px){.hero-grid{grid-template-columns:1fr;gap:20px}.hero-art{max-width:420px}}

/* hero art */
.ha-bezel{fill:var(--bezel)} .ha-screen{fill:var(--scr)} .ha-base{fill:var(--bezel)} .ha-notch{fill:var(--surface-2)}
.ha-track{fill:var(--scr-line);opacity:.55} .ha-txt{fill:var(--scr-ink);font:500 13px var(--font-mono)}
.ha-fill{transform-box:fill-box;transform-origin:left center;transform:scaleX(0)}
.ha-fill.f1{fill:#60A5FA;animation:hf1 9s infinite}.ha-fill.f2{fill:#2DD4BF;animation:hf2 9s infinite}.ha-fill.f3{fill:#FBBF24;animation:hf3 9s infinite}
.ha-ok{opacity:0;fill:none;stroke:#4ADE80;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.ha-ok.o1{animation:ho1 9s infinite}.ha-ok.o2{animation:ho2 9s infinite}.ha-ok.o3{animation:ho3 9s infinite}
@keyframes hf1{0%{transform:scaleX(0)}28%,92%{transform:scaleX(1)}100%{transform:scaleX(0)}}
@keyframes hf2{0%,30%{transform:scaleX(0)}58%,92%{transform:scaleX(1)}100%{transform:scaleX(0)}}
@keyframes hf3{0%,60%{transform:scaleX(0)}88%,92%{transform:scaleX(1)}100%{transform:scaleX(0)}}
@keyframes ho1{0%,28%{opacity:0}32%,92%{opacity:1}100%{opacity:0}}
@keyframes ho2{0%,58%{opacity:0}62%,92%{opacity:1}100%{opacity:0}}
@keyframes ho3{0%,88%{opacity:0}90%,92%{opacity:1}100%{opacity:0}}
.ha-chip rect{fill:var(--surface);stroke:var(--line)} .ha-chip text{fill:var(--ink);font:500 12px var(--font-mono)}
.ha-chip{animation:bob 5s ease-in-out infinite}.ha-chip.b2{animation-delay:-1.6s}.ha-chip.b3{animation-delay:-3.2s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}

/* meeting cards */
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
@media (max-width:900px){.cards{grid-template-columns:1fr}}
.pcard{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;text-decoration:none;color:var(--ink);box-shadow:var(--shadow);transition:transform .2s,border-color .2s}
.pcard:hover{transform:translateY(-3px);border-color:var(--hue)}
.pcard .art{background:color-mix(in srgb,var(--hue) 11%,var(--surface));border-bottom:1px solid var(--line);aspect-ratio:12/7;display:grid;place-items:center}
.pcard .art svg{width:100%;height:100%}
.pcard .body{display:flex;flex-direction:column;gap:10px;padding:20px 20px 22px;flex:1}
.pcard .tag{font:500 12px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--hue)}
.pcard h3{font-size:22px}
.pcard p{color:var(--muted);font-size:15px}
.pcard .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.pcard .go{margin-top:auto;padding-top:8px;display:flex;align-items:center;justify-content:space-between;font-weight:600;color:var(--hue)}
.pcard .go svg{width:20px;height:20px;transition:transform .2s}
.pcard:hover .go svg{transform:translateX(4px)}
.h1c{--hue:var(--c1)}.h2c{--hue:var(--c2)}.h3c{--hue:var(--c3)}
.score-pill{font:500 12px var(--font-mono);padding:3px 8px;border-radius:99px;background:var(--ok-soft);color:var(--ok)}

/* card art */
.ca-line{fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ca-fill{fill:var(--surface);stroke:var(--muted);stroke-width:2}
.ca-hue{fill:var(--hue)}.ca-hue-s{fill:none;stroke:var(--hue);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.ca-scr{fill:var(--scr)}
.usb{animation:usb 4.5s ease-in-out infinite}
@keyframes usb{0%{transform:translateX(-34px);opacity:0}15%{opacity:1}35%,85%{transform:translateX(0);opacity:1}100%{transform:translateX(0);opacity:0}}
.pg{transform-box:fill-box;transform-origin:left;fill:#60A5FA;animation:pg 4.5s ease-in-out infinite}
@keyframes pg{0%,30%{transform:scaleX(0)}85%,100%{transform:scaleX(1)}}
.warn-g{animation:wg 4s infinite}.ok-g{animation:og 4s infinite}
@keyframes wg{0%,45%{opacity:1}55%,95%{opacity:0}100%{opacity:1}}
@keyframes og{0%,45%{opacity:0}55%,95%{opacity:1}100%{opacity:0}}
.tile{transform-box:fill-box;transform-origin:center;animation:pop 3.6s infinite}.tile.t2{animation-delay:.25s}.tile.t3{animation-delay:.5s}
@keyframes pop{0%,10%{transform:scale(.6);opacity:.2}25%,85%{transform:scale(1);opacity:1}100%{transform:scale(.6);opacity:.2}}
.dl{animation:dl 1.8s ease-in-out infinite}
@keyframes dl{0%,100%{transform:translateY(-3px)}50%{transform:translateY(5px)}}

/* identity */
.id-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
@media (max-width:760px){.id-grid{grid-template-columns:1fr}}
.idcard{display:flex;gap:18px;align-items:center;padding:22px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.avatar{width:68px;height:68px;border-radius:16px;display:grid;place-items:center;flex:none;font:700 22px var(--font-display);background:var(--ink);color:var(--bg)}
.avatar.t{background:var(--accent-soft);color:var(--accent)}
.idcard dl{margin:6px 0 0;display:grid;grid-template-columns:auto 1fr;gap:2px 14px;font-size:14.5px}
.idcard dt{color:var(--muted)}.idcard dd{margin:0;font-weight:500}
.idcard h3{font-size:20px}

.cta-band{display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;padding:28px;border-radius:18px;background:var(--ink);color:var(--bg)}
.cta-band h3{font-size:24px}.cta-band p{opacity:.78;margin-top:6px;max-width:520px}
.cta-band .btn{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

footer{border-top:1px solid var(--line);margin-top:40px;padding-block:28px;color:var(--muted);font-size:14px}
footer .wrap{display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between}

/* lesson page */
.l-head{padding-block:36px 8px}
.crumbs{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted);margin-bottom:18px}
.crumbs a{color:var(--muted);text-decoration:none}.crumbs a:hover{color:var(--accent)}
.l-title{display:flex;flex-direction:column;gap:14px;max-width:760px}
.l-title .tag{font:500 13px/1 var(--font-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--hue)}
.l-title h1{font-size:clamp(32px,4.6vw,48px);font-weight:700}
.l-title p{font-size:18px;color:var(--muted)}
.l-layout{display:grid;grid-template-columns:210px minmax(0,1fr);gap:40px;padding-block:28px 24px;align-items:start}
@media (max-width:960px){.l-layout{grid-template-columns:minmax(0,1fr);gap:20px}}
.toc{position:sticky;top:calc(80px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:2px}
.toc .eyebrow{margin-bottom:10px}
.toc button{text-align:left;background:none;border:0;border-left:2px solid var(--line);padding:8px 14px;color:var(--muted);font-size:14.5px}
.toc button:hover{color:var(--ink);border-left-color:var(--hue)}
.toc button.on{color:var(--hue);border-left-color:var(--hue);font-weight:600}
@media (max-width:960px){
  .toc{position:sticky;top:calc(64px + env(safe-area-inset-top,0px));z-index:20;flex-direction:row;overflow-x:auto;background:var(--bg);padding:8px 0;margin-inline:-4px;gap:6px;border-bottom:1px solid var(--line)}
  .toc .eyebrow{display:none}
  .toc button{border:1px solid var(--line);border-radius:99px;padding:6px 14px;white-space:nowrap;background:var(--surface)}
  .toc button.on{background:color-mix(in srgb,var(--hue) 14%,var(--surface));border-color:var(--hue)}
}
.l-body{display:flex;flex-direction:column;gap:56px;min-width:0}
.sec{scroll-margin-top:96px;min-width:0}
@media (max-width:960px){.sec{scroll-margin-top:136px}}
.sec>h2{font-size:clamp(24px,3vw,30px);margin-bottom:6px}
.sec>.sub{color:var(--muted);margin-bottom:22px;max-width:680px}
.prose{max-width:720px;display:flex;flex-direction:column;gap:14px}
.prose h3{font-size:19px;margin-top:10px}
.prose ul,.prose ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.goals{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 22px}
.goals h3{font-size:16px;margin-bottom:10px}
.goals ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.goals li{display:flex;gap:10px;align-items:flex-start;font-size:15.5px}
.goals li svg{width:18px;height:18px;flex:none;margin-top:3px;color:var(--hue)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:8px;min-width:0}
.tcard h3{font-size:17px}
.tcard p,.tcard li{font-size:15px;color:var(--muted)}
.tcard ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.tcard .num{font:600 12px var(--font-mono);color:var(--hue);letter-spacing:.08em}
.callout{display:flex;gap:12px;padding:14px 16px;border-radius:12px;font-size:15px;border:1px solid transparent;min-width:0}
.callout svg{width:20px;height:20px;flex:none;margin-top:2px}
.callout b{display:block;margin-bottom:2px}
.callout.tip{background:var(--accent-soft);color:var(--ink);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}.callout.tip svg{color:var(--accent)}
.callout.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}.callout.warn svg{color:var(--warn)}
.callout.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}.callout.bad svg{color:var(--bad)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.tbl table{border-collapse:collapse;width:100%;min-width:520px;font-size:14.5px}
.tbl th,.tbl td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font:600 12px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface-2)}
.tbl tr:last-child td{border-bottom:0}
pre.code{margin:0;background:var(--ink);color:var(--bg);border-radius:12px;padding:14px 16px;overflow-x:auto;font:400 13.5px/1.6 var(--font-mono)}
pre.code .c{opacity:.6}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0;counter-reset:st}
.steps li{position:relative;padding:0 0 22px 46px;counter-increment:st;min-width:0}
.steps li::before{content:counter(st);position:absolute;left:0;top:0;width:30px;height:30px;border-radius:50%;background:color-mix(in srgb,var(--hue) 14%,var(--surface));color:var(--hue);display:grid;place-items:center;font:600 14px var(--font-mono)}
.steps li::after{content:"";position:absolute;left:14px;top:34px;bottom:4px;width:2px;background:var(--line)}
.steps li:last-child::after{display:none}
.steps li b{display:block;font-family:var(--font-display);font-size:16.5px;margin-bottom:2px}
.steps li span{color:var(--muted);font-size:15px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tab{padding:8px 16px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:14.5px}
.tab[aria-selected="true"]{background:var(--hue);border-color:var(--hue);color:var(--on-accent)}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding-block:8px 24px}
.pager a{display:flex;flex-direction:column;gap:4px;padding:16px 18px;border:1px solid var(--line);border-radius:14px;background:var(--surface);text-decoration:none;color:var(--ink)}
.pager a:hover{border-color:var(--accent)}
.pager small{color:var(--muted);font:500 12px var(--font-mono);letter-spacing:.06em;text-transform:uppercase}
.pager a.next{text-align:right;grid-column:2}
@media (max-width:560px){.pager{grid-template-columns:1fr}.pager a.next{grid-column:auto}}

/* simulation */
.sim{border:1px solid var(--line);background:var(--surface);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.sim-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.sim-head h3{font-size:18px;margin-top:4px}
.stepcount{font:500 13px var(--font-mono);color:var(--muted)}.stepcount b{color:var(--hue)}
.sim-body{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}
@media (max-width:860px){.sim-body{grid-template-columns:minmax(0,1fr)}}
.sim-view{background:var(--surface-2);padding:20px;display:flex;flex-direction:column;align-items:center;min-width:0}
.monitor{container-type:inline-size;width:100%;background:var(--bezel);padding:10px;border-radius:12px;position:relative}
.screen{aspect-ratio:16/10;background:var(--scr);color:var(--scr-ink);border-radius:4px;overflow:hidden;position:relative;font-size:max(8.5px,2.35cqw);line-height:1.38;display:flex;flex-direction:column;animation:fadein .35s}

<script>
(function(){
'use strict';

/* ====== Identitas (ubah di sini) ====== */
const SEKOLAH={nama:'SMA IT Caringin',mapel:'Informatika',kelas:'X'};
const GURU={nama:'Sulaeman, S.Kom',jabatan:'Guru Mata Pelajaran Informatika',kontak:'081322542369'};

/* ====== Util ====== */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const cleanups=[];
const initials=n=>n.split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();

const ic=(d,extra='')=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ${extra}>${d}</svg>`;
const I={
  menu:ic('<path d="M4 7h16M4 12h16M4 17h16"/>'),

  sun:ic('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'),

/* ====== Callout / kuis helper ====== */
const callout=(type,title,html)=>`<div class="callout ${type}">${type==='tip'?I.info:I.warn}<div><b>${title}</b>${html}</div></div>`;

/* ====== Stepper (animasi langkah demi langkah) ====== */
function mountStepper(root,cfg){
  let i=0,timer=null;
  const steps=cfg.steps;
  root.innerHTML=`
  <div class="sim">
    <div class="sim-head"><div><span class="eyebrow">${I.film.replace('<svg','<svg style="width:13px;height:13px;vertical-align:-2px;margin-right:5px"')}Animasi interaktif</span><h3>${cfg.title}</h3></div>
      <div class="stepcount">Langkah <b data-cur>1</b> / ${steps.length}</div></div>
    ${cfg.tabs?`<div class="tabs" role="tablist" style="padding:14px 18px 0;margin:0">${cfg.tabs.map((t,k)=>`<button class="tab" role="tab" data-tab="${k}" aria-selected="${k===cfg.tab}">${t}</button>`).join('')}</div>`:''}

      <div class="sim-view"><div class="monitor"><div class="screen" data-screen></div></div><div class="stand"></div><div class="stand-base"></div></div>
      <div class="sim-info" aria-live="polite"><span class="eyebrow" data-kicker></span><h4 data-title></h4><p class="si-desc" data-desc></p><div data-tip></div></div>
    </div>
    <div class="sim-ctrl">
      <button class="btn sm" data-prev type="button">${I.back}Sebelumnya</button>
      <button class="btn sm primary" data-next type="button">Berikutnya${I.arrow}</button>
      <button class="btn sm" data-play type="button">${I.play}Putar otomatis</button>
      <button class="btn sm" data-reset type="button" aria-label="Ulangi dari awal">${I.reset}</button>
      <div class="dots" data-dots></div>
    </div>
  </div>`;
  const scr=$('[data-screen]',root),dots=$('[data-dots]',root),playBtn=$('[data-play]',root);
  const api={next:()=>go(i+1),go};
  function stop(){clearInterval(timer);timer=null;playBtn.innerHTML=I.play+'Putar otomatis'}
  function go(n,keep){
    if(!keep&&timer&&n!==i+1)stop();
    i=Math.max(0,Math.min(steps.length-1,n));
    const s=steps[i];
    scr.className='screen'+(s.light?' light':'');
    scr.innerHTML=s.screen();
    $$('[data-next-hit]',scr).forEach(el=>{el.addEventListener('click',()=>go(i+1))});
    $('[data-cur]',root).textContent=i+1;
    $('[data-kicker]',root).textContent=s.kicker||('Langkah '+(i+1));
    $('[data-title]',root).textContent=s.title;
    $('[data-desc]',root).innerHTML=s.desc;
    $('[data-tip]',root).innerHTML=s.tip?callout('tip','Tips',s.tip):'';
    $('[data-prev]',root).disabled=i===0;
    $('[data-next]',root).disabled=i===steps.length-1;
    dots.innerHTML=steps.map((_,k)=>`<button class="dot ${k<i?'done':''} ${k===i?'cur':''}" data-d="${k}" aria-label="Ke langkah ${k+1}" ${k===i?'aria-current="step"':''}></button>`).join('');
    if(i===steps.length-1&&timer)stop();
  }
  root.addEventListener('click',e=>{
    const t=e.target.closest('button');if(!t)return;
    if(t.dataset.d!==undefined)go(+t.dataset.d);
    else if(t.hasAttribute('data-prev'))go(i-1);
    else if(t.hasAttribute('data-next'))go(i+1);
    else if(t.hasAttribute('data-reset')){stop();go(0)}
    else if(t.hasAttribute('data-play')){
      if(timer){stop();return}
      if(i===steps.length-1)go(0,true);
      playBtn.innerHTML=I.pause+'Jeda';
      timer=setInterval(()=>go(i+1,true),steps[i].dur||4600);
    }else if(t.dataset.tab!==undefined&&cfg.onTab){stop();cfg.onTab(+t.dataset.tab)}
  });
  cleanups.push(stop);
  go(0);
}

/* ====== Kuis ====== */
function mountQuiz(el,key,qs){
  const L='ABCDE';
  let order,idx,score,missed;
  const bestKey='ri:best:'+key;
  function start(){order=shuffle(qs.map((_,i)=>i));idx=0;score=0;missed=[];draw()}
  function draw(){
    if(idx>=order.length)return done();
    const q=qs[order[idx]];
    const opts=shuffle(q.o.map((t,i)=>({t,ok:i===q.a})));
    el.innerHTML=`<div class="quiz">
      <div class="q-top"><div class="q-prog" role="progressbar" aria-valuemin="0" aria-valuemax="${qs.length}" aria-valuenow="${idx}"><i style="width:${idx/qs.length*100}%"></i></div><span>Soal ${idx+1} dari ${qs.length}</span></div>
      <div class="q-text">${q.q}</div>
      <div class="q-opts" role="group" aria-label="Pilihan jawaban">${opts.map((o,k)=>`<button class="q-opt" data-k="${k}" type="button"><span class="l">${L[k]}</span><span>${o.t}</span></button>`).join('')}</div>
      <div class="q-fb" aria-live="polite"></div><div class="q-next"></div></div>`;
    $$('.q-opt',el).forEach(b=>b.addEventListener('click',()=>{
      const k=+b.dataset.k,ok=opts[k].ok;
      $$('.q-opt',el).forEach((x,j)=>{x.disabled=true;if(opts[j].ok)x.classList.add('ok')});
      if(!ok)b.classList.add('no');
      if(ok)score++;else missed.push(q);
      $('.q-fb',el).innerHTML=callout(ok?'tip':'warn',ok?'Tepat!':'Belum tepat',q.e);
      const last=idx===order.length-1;
      $('.q-next',el).innerHTML=`<button class="btn primary" type="button">${last?'Lihat hasil':'Soal berikutnya'}${I.arrow}</button>`;
      const nb=$('.q-next .btn',el);nb.addEventListener('click',()=>{idx++;draw();el.scrollIntoView({block:'nearest'})});nb.focus({preventScroll:true});
    }));
  }
  function done(){
    const pct=Math.round(score/qs.length*100);
    const prev=parseInt(store.get(bestKey)||'-1',10);
    if(pct>prev)store.set(bestKey,String(pct));
    const msg=pct===100?'Sempurna. Semua jawaban benar.':pct>=75?'Bagus. Pemahamanmu sudah kuat.':pct>=50?'Cukup baik. Baca ulang materi yang masih keliru.':'Ayo pelajari lagi animasinya, lalu coba ulang.';
    el.innerHTML=`<div class="quiz q-res">
      <div class="q-score"><div class="ring" style="--p:${pct}"><div>${pct}</div></div>
        <div><h3>${score} dari ${qs.length} soal benar</h3><p>${msg}</p></div></div>
      ${missed.length?`<div><h4 style="font-size:17px;margin-bottom:10px">Yang perlu diulang</h4><div class="review">${missed.map(q=>`<div class="tcard"><b>${q.q}</b><p>Jawaban benar: ${q.o[q.a]}</p><p>${q.e}</p></div>`).join('')}</div></div>`:''}
      <div><button class="btn primary" type="button">${I.reset}Ulangi latihan</button></div></div>`;
    $('.btn',el).addEventListener('click',start);
  }
  start();
}

function route(){
  const id=cur;
  const key=routes[id]?id:'beranda';
  cleanups.splice(0).forEach(f=>{try{f()}catch(e){}});
  const r=routes[key];
  app.innerHTML=r.html();
  if(r.mount)r.mount();
  $$('#nav a').forEach(a=>{if(a.dataset.r===key)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  $('#nav').classList.remove('open');$('#menuBtn').setAttribute('aria-expanded','false');$('#menuBtn').innerHTML=I.menu;
  window.scrollTo(0,0);
  if(r.lesson)bindToc();
}
function bindToc(){
  const btns=$$('.toc button');
  btns.forEach(b=>b.addEventListener('click',()=>{const t=document.getElementById(b.dataset.go);if(t)t.scrollIntoView({behavior:'smooth',block:'start'})}));
  const secs=btns.map(b=>document.getElementById(b.dataset.go)).filter(Boolean);
  const onScroll=()=>{
    let cur=secs[0];secs.forEach(s=>{if(s.getBoundingClientRect().top<160)cur=s});
    btns.forEach(b=>b.classList.toggle('on',cur&&b.dataset.go===cur.id));
  };
  window.addEventListener('scroll',onScroll,{passive:true});cleanups.push(()=>window.removeEventListener('scroll',onScroll));onScroll();
}

const Q1=[
 {q:'Apa fungsi utama sistem operasi seperti Windows?',o:['Mengelola perangkat keras dan menjalankan aplikasi','Hanya menampilkan gambar di layar','Menyimpan data di internet','Mempercepat koneksi Wi-Fi'],a:0,e:'Sistem operasi menjadi perantara antara pengguna, aplikasi, dan perangkat keras, termasuk memori, penyimpanan, dan perangkat input/output.'},
 {q:'Langkah apa yang <b>wajib</b> dilakukan sebelum instalasi bersih pada komputer yang berisi data penting?',o:['Mencabut kabel monitor','Membackup data penting ke tempat lain','Mengganti RAM','Menghapus BIOS'],a:1,e:'Instalasi bersih dan penghapusan partisi menghilangkan data. Backup ke flashdisk, hard disk eksternal, atau penyimpanan cloud dilakukan lebih dulu.'},
 {q:'Apa fungsi <b>boot menu</b> saat komputer dinyalakan?',o:['Memilih perangkat yang dipakai untuk memulai komputer, misalnya flashdisk','Mengatur kecerahan layar','Menghapus virus','Mengaktifkan Wi-Fi'],a:0,e:'Boot menu memungkinkan kita memilih perangkat boot satu kali, misalnya flashdisk berisi installer Windows, tanpa mengubah urutan boot permanen.'},
 {q:'Komputer memakai firmware <b>UEFI</b>. Skema partisi yang sesuai adalah...',o:['FAT8','GPT','Dynamic RAM','ISO'],a:1,e:'UEFI berpasangan dengan GPT, sedangkan BIOS Legacy berpasangan dengan MBR. Ketidakcocokan keduanya memunculkan pesan "Windows cannot be installed to this disk".'},
 {q:'Untuk instalasi bersih dari flashdisk, opsi yang dipilih pada layar tipe instalasi adalah...',o:['Upgrade: Install Windows and keep files','Custom: Install Windows only (advanced)','Repair your computer','Reset this PC'],a:1,e:'Custom memungkinkan kita mengatur partisi dan memasang Windows dari awal. Upgrade hanya tersedia bila setup dijalankan dari dalam Windows.'},
 {q:'Mengapa flashdisk sebaiknya dicabut saat komputer restart pertama kali selama instalasi?',o:['Agar flashdisk tidak panas','Agar komputer tidak boot ulang ke installer dan mengulang proses','Agar Windows lebih cepat terinstal','Agar product key terisi otomatis'],a:1,e:'Jika flashdisk masih menjadi prioritas boot, komputer bisa kembali ke layar Windows Setup alih-alih melanjutkan ke tahap konfigurasi.'},
 {q:'Syarat Windows 11 yang <b>tidak</b> diwajibkan pada Windows 10 adalah...',o:['Layar berwarna','TPM 2.0 dan Secure Boot','Mouse','Kabel LAN'],a:1,e:'Windows 11 mensyaratkan firmware UEFI dengan Secure Boot dan chip TPM 2.0. Ini alasan banyak komputer lama tidak bisa memasang Windows 11.'},
 {q:'Urutan yang <b>benar</b> dalam instalasi Windows dari flashdisk adalah...',o:['Pilih partisi → boot flashdisk → pilih bahasa → pengaturan awal','Boot flashdisk → pilih bahasa → Install now → pilih partisi → penyalinan file → pengaturan awal','Pengaturan awal → boot flashdisk → Install now → pilih partisi','Install now → pengaturan awal → pilih bahasa → boot flashdisk'],a:1,e:'Alurnya: boot dari flashdisk, bahasa, Install now, product key, tipe instalasi, partisi, penyalinan file dan restart, lalu pengaturan awal (OOBE) hingga desktop.'}
];
routes['pertemuan-1']={lesson:true,
 html:()=>lessonShell({cls:'h1c',n:1,title:'Instalasi Windows',minutes:90,nq:Q1.length,
  lead:'Memasang sistem operasi dari nol: menyiapkan media instalasi, masuk ke boot menu, mengatur partisi, sampai desktop pertama tampil.',
  toc:[['p1-konsep','Konsep dasar'],['p1-persiapan','Persiapan'],['p1-animasi','Animasi instalasi'],['p1-masalah','Masalah umum'],['p1-latihan','Latihan soal']],
  body:`
  <section class="sec" id="p1-konsep"><div class="goals"><h3>Tujuan pembelajaran</h3><ul>
    <li>${I.check}Menjelaskan fungsi sistem operasi dan perbedaan instalasi bersih dengan upgrade.</li>
    <li>${I.check}Menyiapkan media instalasi dan mengakses boot menu.</li>
    <li>${I.check}Menjalankan langkah instalasi Windows secara berurutan, termasuk mengatur partisi.</li></ul></div>
    <h2 style="margin-top:36px">Konsep dasar</h2><p class="sub">Sebelum menekan tombol apa pun, pahami dulu apa yang sedang dipasang dan syarat apa yang harus dipenuhi.</p>
    <div class="prose">
      <p><b>Sistem operasi (OS)</b> adalah perangkat lunak utama yang mengatur perangkat keras dan menjalankan aplikasi. Contohnya Windows, macOS, Linux, dan Android. Tanpa OS, komputer hanya kumpulan komponen yang tidak bisa dipakai.</p>
      <p><b>Instalasi bersih</b> (<i>clean install</i>) memasang OS di partisi yang sudah dikosongkan. Hasilnya bersih dari sisa program lama. <b>Upgrade</b> memperbarui OS lama sambil mempertahankan file dan aplikasi.</p>
    </div>
    <div class="grid2" style="margin-top:20px">
      <div class="tcard"><h3>Windows 11</h3><p>Versi yang dianjurkan untuk perangkat yang memenuhi syarat. Mewajibkan UEFI, Secure Boot, dan TPM 2.0.</p></div>
      <div class="tcard"><h3>Windows 10</h3><p>Dukungan resminya berakhir pada 14 Oktober 2025. Masih berguna dipelajari karena banyak komputer sekolah memakainya.</p></div>
    </div>
    <h3 style="font-size:18px;margin:26px 0 12px">Syarat minimum Windows 11</h3>
    <div class="tbl"><table><thead><tr><th>Komponen</th><th>Syarat minimum</th></tr></thead><tbody>
      <tr><td>Prosesor</td><td>1 GHz atau lebih, minimal 2 inti, 64-bit</td></tr>
      <tr><td>RAM</td><td>4 GB</td></tr>
      <tr><td>Penyimpanan</td><td>64 GB atau lebih</td></tr>
      <tr><td>Firmware</td><td>UEFI dengan Secure Boot</td></tr>
      <tr><td>Keamanan</td><td>TPM versi 2.0</td></tr>
      <tr><td>Grafis</td><td>Kompatibel dengan DirectX 12 dan driver WDDM 2.0</td></tr></tbody></table></div>
  </section>

  <section class="sec" id="p1-persiapan"><h2>Persiapan</h2><p class="sub">Instalasi yang gagal biasanya bermula dari persiapan yang terlewat.</p>
    <div class="grid3">
      <div class="tcard"><span class="num">ALAT DAN BAHAN</span><h3>Yang disiapkan</h3><ul><li>Flashdisk minimal 8 GB</li><li>File ISO Windows resmi</li><li>Rufus atau Media Creation Tool</li><li>Charger (untuk laptop)</li></ul></div>
      <div class="tcard"><span class="num">KEAMANAN DATA</span><h3>Backup dulu</h3><ul><li>Salin dokumen, foto, dan folder Desktop</li><li>Catat lisensi aplikasi berbayar</li><li>Simpan driver Wi-Fi/LAN di flashdisk lain</li></ul></div>
      <div class="tcard"><span class="num">FIRMWARE</span><h3>Cek mode boot</h3><ul><li>UEFI memakai partisi GPT</li><li>BIOS Legacy memakai partisi MBR</li><li>Secure Boot dan TPM untuk Windows 11</li></ul></div>
    </div>
    <div style="margin-top:20px">${callout('warn','Isi flashdisk akan terhapus','<p>Rufus memformat flashdisk saat membuat media bootable. Pindahkan dulu file penting di dalamnya.</p>')}</div>
    <h3 style="font-size:18px;margin:30px 0 14px">Membuat flashdisk bootable dengan Rufus</h3>
    <ol class="steps">
      <li><b>Unduh ISO</b><span>Ambil file ISO dari situs resmi Microsoft (microsoft.com/software-download). Hindari ISO dari situs tidak resmi.</span></li>
      <li><b>Buka Rufus dan pilih flashdisk</b><span>Colok flashdisk, jalankan Rufus, lalu pastikan kolom <i>Device</i> menunjuk ke flashdisk yang benar.</span></li>
      <li><b>Pilih file ISO</b><span>Pada <i>Boot selection</i> pilih <i>Disk or ISO image</i>, klik <b>SELECT</b>, lalu pilih file ISO Windows.</span></li>
      <li><b>Sesuaikan skema partisi</b><span>Pilih <b>GPT</b> untuk komputer UEFI atau <b>MBR</b> untuk BIOS Legacy.</span></li>
      <li><b>Klik START</b><span>Setujui peringatan format dan tunggu sampai status <i>READY</i>. Flashdisk siap dipakai.</span></li></ol>
    <h3 style="font-size:18px;margin:30px 0 14px">Tombol boot menu dan BIOS menurut merek</h3>
    <div class="tbl"><table><thead><tr><th>Merek</th><th>Boot menu</th><th>Masuk BIOS/UEFI</th></tr></thead><tbody>
      <tr><td>Acer</td><td><kbd>F12</kbd></td><td><kbd>F2</kbd></td></tr>
      <tr><td>ASUS</td><td><kbd>Esc</kbd> atau <kbd>F8</kbd></td><td><kbd>F2</kbd> atau <kbd>Del</kbd></td></tr>
      <tr><td>Lenovo</td><td><kbd>F12</kbd></td><td><kbd>F1</kbd> atau <kbd>F2</kbd></td></tr>
      <tr><td>HP</td><td><kbd>Esc</kbd> lalu <kbd>F9</kbd></td><td><kbd>F10</kbd></td></tr>
      <tr><td>Dell</td><td><kbd>F12</kbd></td><td><kbd>F2</kbd></td></tr>
      <tr><td>MSI</td><td><kbd>F11</kbd></td><td><kbd>Del</kbd></td></tr></tbody></table></div>
    <p class="g-note" style="margin-top:10px">Tombol bisa berbeda antarmodel. Perhatikan teks kecil di layar saat logo produsen muncul.</p>
  </section>

  <section class="sec" id="p1-animasi"><h2>Animasi instalasi Windows</h2><p class="sub">Ikuti layar yang akan kamu temui saat instalasi. Klik bagian yang berkedip, atau pakai tombol di bawah layar.</p>
    <div id="sim1"></div></section>

  <section class="sec" id="p1-masalah"><h2>Masalah umum</h2><p class="sub">Empat masalah yang paling sering muncul di ruang praktik.</p>
    <div class="grid2">
      <div class="tcard"><h3>Flashdisk tidak muncul di boot menu</h3><p>Coba port USB lain (USB 2.0 sering lebih kompatibel), buat ulang media bootable, dan cek mode UEFI atau Legacy di BIOS.</p></div>
      <div class="tcard"><h3>"Windows cannot be installed to this disk"</h3><p>Biasanya skema partisi tidak cocok dengan mode boot. UEFI butuh GPT, Legacy butuh MBR.</p></div>
      <div class="tcard"><h3>Kembali ke layar setup setelah restart</h3><p>Cabut flashdisk, atau ubah urutan boot agar SSD/HDD berada di posisi pertama.</p></div>
      <div class="tcard"><h3>Tidak ada Wi-Fi setelah instalasi</h3><p>Driver jaringan belum terpasang. Lanjutkan ke Pertemuan 2 untuk cara mengecek dan memasangnya.</p></div></div>
  </section>

  <section class="sec" id="p1-latihan"><h2>Latihan soal</h2><p class="sub">${Q1.length} soal pilihan ganda. Setiap jawaban langsung diberi penjelasan.</p><div id="quiz1"></div></section>`})+pager(null,['pertemuan-2','Pertemuan 2 · Instalasi Driver']),
 mount:()=>{mountStepper($('#sim1'),{title:'Simulasi instalasi Windows dari flashdisk',steps:winSteps});mountQuiz($('#quiz1'),'pertemuan-1',Q1)}
};

routes['pertemuan-2']={lesson:true,
 html:()=>lessonShell({cls:'h2c',n:2,title:'Instalasi Driver',minutes:90,nq:Q2.length,
  lead:'Windows sudah terpasang, tetapi belum semua perangkat keras dikenali. Pelajari cara menemukan driver yang belum ada, lalu memasangnya secara online maupun offline.',
  toc:[['p2-konsep','Konsep dasar'],['p2-cek','Cara cek driver'],['p2-animasi','Animasi instalasi'],['p2-unduh','Unduh dan pasang'],['p2-latihan','Latihan soal']],
  body:`
  <section class="sec" id="p2-konsep"><div class="goals"><h3>Tujuan pembelajaran</h3><ul>
    <li>${I.check}Menjelaskan fungsi driver dan tanda-tanda driver belum terpasang.</li>
    <li>${I.check}Mengecek driver yang belum terinstal lewat Device Manager dan Hardware ID.</li>
    <li>${I.check}Mengunduh dan memasang driver secara online maupun offline.</li></ul></div>
    <h2 style="margin-top:36px">Konsep dasar</h2><p class="sub">Driver membuat komponen komputer bisa "bicara" dengan Windows.</p>
    <div class="prose"><p><b>Driver</b> adalah perangkat lunak yang menghubungkan sistem operasi dengan perangkat keras. Tanpa driver yang tepat, perangkat bisa tidak berfungsi atau bekerja tidak maksimal.</p></div>
    <div class="grid3" style="margin-top:20px">
      <div class="tcard"><h3>Chipset</h3><p>Mengatur komunikasi antar komponen di motherboard. Dipasang pertama.</p></div>
      <div class="tcard"><h3>Grafis (VGA)</h3><p>Tanpa driver, resolusi layar rendah dan tampilan terlihat buram atau pecah.</p></div>
      <div class="tcard"><h3>Audio</h3><p>Tanpa driver, tidak ada suara dari speaker atau headphone.</p></div>
      <div class="tcard"><h3>LAN dan Wi-Fi</h3><p>Tanpa driver, jaringan tidak terdeteksi sehingga komputer tidak bisa online.</p></div>
      <div class="tcard"><h3>Bluetooth</h3><p>Dibutuhkan untuk mouse, keyboard, dan headset nirkabel.</p></div>
      <div class="tcard"><h3>Touchpad dan lainnya</h3><p>Gesture touchpad, kamera, dan tombol fungsi laptop.</p></div></div>
  </section>

  <section class="sec" id="p2-cek"><h2>Cara cek driver yang belum terinstal</h2><p class="sub">Empat cara, dari yang paling mudah sampai yang paling teknis.</p>
    <div class="grid2">
      <div class="tcard"><span class="num">CARA 1</span><h3>Device Manager</h3><ul><li>Tekan <kbd>Win</kbd>+<kbd>X</kbd>, pilih <b>Device Manager</b></li><li>Cari kelompok <i>Other devices</i> atau ikon ⚠</li><li>Klik kanan perangkat, buka <i>Properties</i> dan baca <i>Device status</i></li></ul></div>
      <div class="tcard"><span class="num">CARA 2</span><h3>Hardware ID</h3><ul><li>Properties → tab <b>Details</b></li><li>Pada <i>Property</i> pilih <b>Hardware Ids</b></li><li>Salin nilai teratas, cari di mesin pencari</li></ul>
        <pre class="code">PCI\\VEN_8086&amp;DEV_2723&amp;SUBSYS_00748086
<span class="c">VEN_8086 = Intel · DEV_2723 = Wi-Fi 6 AX200</span></pre></div>
      <div class="tcard"><span class="num">CARA 3</span><h3>Windows Update</h3><ul><li>Settings → Windows Update</li><li>Advanced options → <b>Optional updates</b></li><li>Centang <i>Driver updates</i> yang tersedia, lalu Download &amp; install</li></ul></div>
      <div class="tcard"><span class="num">CARA 4</span><h3>Perintah teks</h3><p>Daftar perangkat bermasalah lewat PowerShell:</p>
        <pre class="code">Get-PnpDevice -PresentOnly | Where-Object Status -ne 'OK'</pre><p>Daftar driver terpasang lewat Command Prompt:</p><pre class="code">driverquery /v</pre></div></div>
    <div style="margin-top:20px">${callout('tip','Ketahui tipe perangkatmu','<p>Driver harus sesuai model. Lihat stiker di bagian bawah laptop, atau tekan <kbd>Win</kbd>+<kbd>R</kbd>, ketik <code>msinfo32</code>, lalu baca <i>System Model</i> dan <i>System Type</i> (32-bit atau 64-bit).</p>')}</div>
  </section>

  <section class="sec" id="p2-animasi"><h2>Animasi instalasi driver</h2><p class="sub">Simulasi memasang driver Wi-Fi lewat Device Manager. Klik bagian yang berkedip untuk melanjutkan.</p><div id="sim2"></div></section>

  <section class="sec" id="p2-unduh"><h2>Mengunduh dan memasang driver</h2><p class="sub">Pilih jalur sesuai kondisi: komputer sudah online atau belum.</p>
    <div class="grid2">
      <div class="tcard"><span class="num">JALUR ONLINE</span><h3>Komputer sudah tersambung internet</h3><ol class="steps" style="margin-top:8px">
        <li style="padding-bottom:14px"><b>Windows Update</b><span>Cek Optional updates. Cara paling cepat untuk driver umum.</span></li>
        <li style="padding-bottom:14px"><b>Situs resmi produsen laptop</b><span>Buka halaman Support atau Drivers merek laptop, masukkan model, pilih versi Windows, lalu unduh.</span></li>
        <li style="padding-bottom:14px"><b>Situs pembuat chip</b><span>Intel, AMD, NVIDIA, dan Realtek menyediakan driver terbaru untuk grafis, audio, dan jaringan.</span></li>
        <li style="padding-bottom:0"><b>Aplikasi pembaruan resmi</b><span>Misalnya Intel Driver &amp; Support Assistant, MyASUS, Lenovo Vantage, HP Support Assistant, atau SupportAssist.</span></li></ol></div>
      <div class="tcard"><span class="num">JALUR OFFLINE</span><h3>Komputer belum bisa online</h3><ol class="steps" style="margin-top:8px">
        <li style="padding-bottom:14px"><b>Unduh di komputer lain</b><span>Pakai komputer yang online, unduh driver sesuai model dan versi Windows. Utamakan driver LAN/Wi-Fi.</span></li>
        <li style="padding-bottom:14px"><b>Simpan ke flashdisk</b><span>Ekstrak file ZIP jika perlu, lalu salin foldernya ke flashdisk.</span></li>
        <li style="padding-bottom:14px"><b>Pasang manual</b><span>Jalankan <code>setup.exe</code> di folder driver, atau Device Manager → Update driver → <i>Browse my computer</i> → pilih folder → Next.</span></li>
        <li style="padding-bottom:0"><b>Pakai cadangan driver</b><span>Sebelum instalasi ulang, ekspor driver dengan perintah di bawah.</span></li></ol></div></div>
    <pre class="code" style="margin-top:16px"><span class="c">:: Command Prompt (Run as administrator)</span>
mkdir D:\\BackupDriver
pnputil /export-driver * D:\\BackupDriver</pre>
    <h3 style="font-size:18px;margin:30px 0 14px">Online dibandingkan offline</h3>
    <div class="tbl"><table><thead><tr><th>Aspek</th><th>Online</th><th>Offline</th></tr></thead><tbody>
      <tr><td>Internet</td><td>Wajib saat memasang</td><td>Hanya saat mengunduh di komputer lain</td></tr>
      <tr><td>Kelebihan</td><td>Mudah dan versi terbaru</td><td>Bisa dipakai tanpa jaringan dan diulang di banyak komputer</td></tr>
      <tr><td>Kekurangan</td><td>Perlu koneksi stabil</td><td>Harus menyiapkan file dan memilih versi yang tepat</td></tr>
      <tr><td>Cocok untuk</td><td>Komputer yang sudah punya internet</td><td>Setelah instalasi ulang dan laboratorium sekolah</td></tr></tbody></table></div>
    <div class="grid2" style="margin-top:20px">
      ${callout('warn','Hati-hati sumber driver','<p>Unduh hanya dari situs resmi. Hindari aplikasi "driver updater" yang memunculkan iklan atau meminta pembayaran, karena sebagian membawa malware.</p>')}
      ${callout('tip','Urutan pemasangan yang aman','<p>Chipset → grafis → audio → LAN/Wi-Fi → Bluetooth → lainnya. Restart bila diminta dan buat <i>restore point</i> sebelum mulai.</p>')}
    </div>
  </section>

  <section class="sec" id="p2-latihan"><h2>Latihan soal</h2><p class="sub">${Q2.length} soal pilihan ganda dengan pembahasan.</p><div id="quiz2"></div></section>`})+pager(['pertemuan-1','Pertemuan 1 · Instalasi Windows'],['pertemuan-3','Pertemuan 3 · Instalasi Aplikasi']),
 mount:()=>{mountStepper($('#sim2'),{title:'Simulasi memasang driver lewat Device Manager',steps:drvSteps});mountQuiz($('#quiz2'),'pertemuan-2',Q2)}
};

/* ====================================================================
   PERTEMUAN 3 — INSTALASI APLIKASI
   ==================================================================== */
const APPS=[
 {name:'WinRAR',g:'R',col:'#8E3B9E',site:'www.win-rar.com',label:'Unduh WinRAR',btn:'Download WinRAR 64-bit',file:'winrar-x64-xxx.exe',pub:'win.rar GmbH'},
 {name:'Microsoft Office',g:'O',col:'#D9531E',site:'www.office.com',label:'Pasang Office',btn:'Install apps',file:'OfficeSetup.exe',pub:'Microsoft Corporation'},
 {name:'Google Chrome',g:'C',col:'#2B7CD3',site:'www.google.com/chrome',label:'Browser yang cepat',btn:'Download Chrome',file:'ChromeSetup.exe',pub:'Google LLC'}
];
const gl=(a,s='')=>`<span class="gl" style="background:${a.col};${s}">${a.g}</span>`;
const cb=(t,on)=>`<div class="cb"><i class="${on?'on':''}">${on?'✓':''}</i>${t}</div>`;
const brw=(a,over='')=>`<div class="brw"><div class="addr"><span>https://${a.site}</span></div><div class="page">${gl(a,'width:3.2em;height:3.2em;font-size:1.3em')}<h6>${a.label}</h6><div class="dlbtn ${over?'':'hit'}" ${over?'':'data-next-hit'}>${a.btn}</div></div>${over}</div>`;
const popup=a=>`<div class="pop"><b>Downloads</b><div class="fl hit" data-next-hit>${gl(a)}<div><div>${a.file}</div><small>Open file</small></div></div></div>`;
const uac=a=>`<div class="s-desk" style="flex:1"></div><div class="uac"><div class="dlg"><div class="band">User Account Control</div><div class="dbody"><b>Do you want to allow this app to make changes to your device?</b><div style="display:flex;gap:.8em;align-items:center">${gl(a)}<div>${a.file}<br><small style="color:#4A5560">Verified publisher: ${a.pub}</small></div></div></div><div class="dfoot"><span class="dbtn def hit" data-next-hit>Yes</span><span class="dbtn">No</span></div></div></div>`;
const setupWin=(a,title,body,foot)=>`<div class="s-desk" style="flex:1"></div><div class="setup"><div class="sb">${gl(a,'width:1.6em;height:1.6em;font-size:.9em')}<b>${title}</b></div><div class="sbody">${body}</div><div class="sfoot">${foot}</div></div>`;
const prog=(msg,files)=>`<div>${msg}</div><div class="s-bar light" style="margin-top:.5em"><i></i></div><small style="color:#4A5560">${files}</small>`;
const dl=a=>({kicker:'Langkah 1 · Unduh',title:'Unduh dari situs resmi',light:true,
  desc:'Buka situs resmi (alamat di address bar) dan klik tombol unduh. Pilih versi yang cocok dengan Windows, misalnya <b>64-bit</b> untuk sistem 64-bit.',
  tip:'Cek jenis sistem di Settings → System → About → <i>System type</i>. Klik tombol unduh yang berkedip.',screen:()=>brw(a)});
const openF=a=>({kicker:'Langkah 2 · Jalankan',title:'Buka berkas installer',light:true,
  desc:'Setelah selesai diunduh, buka berkas <code>'+a.file+'</code> dari popup unduhan atau folder <i>Downloads</i> dengan klik dua kali.',
  screen:()=>brw(a,popup(a))});
const uacS=a=>({kicker:'Langkah 3 · Izin',title:'Setujui jendela User Account Control',light:true,
  desc:'Windows menanyakan izin. Periksa <b>Verified publisher</b>: nama penerbitnya harus sesuai ('+a.pub+'). Jika cocok, klik <b>Yes</b>.',
  tip:'Jika penerbit tertulis "Unknown publisher" untuk aplikasi populer, hentikan dulu dan cek ulang sumber unduhan.',screen:()=>uac(a)});
function appSteps(a){
  if(a.name==='WinRAR')return [dl(a),openF(a),uacS(a),
   {kicker:'Langkah 4 · Folder tujuan',title:'Pilih folder tujuan lalu Install',light:true,desc:'Folder bawaan <code>C:\\Program Files\\WinRAR</code> sudah tepat untuk kebanyakan pengguna. Klik <b>Install</b>.',screen:()=>setupWin(a,'WinRAR Setup',`<div>Destination folder</div><div class="fieldv">C:\\Program Files\\WinRAR</div><small style="color:#4A5560">Gunakan folder bawaan kecuali ada alasan khusus.</small>`,`<span class="dbtn def hit" data-next-hit>Install</span><span class="dbtn">Cancel</span>`)},
   {kicker:'Langkah 5 · Menyalin file',title:'Tunggu proses selesai',light:true,dur:5000,desc:'Installer menyalin berkas program. Prosesnya hanya beberapa detik sampai menit.',screen:()=>setupWin(a,'WinRAR Setup',prog('Installing…','Copying: WinRAR.exe, Rar.exe, UnRAR.exe'),`<span class="dbtn">Cancel</span>`)},
   {kicker:'Langkah 6 · Asosiasi file',title:'Pilih jenis berkas yang dibuka WinRAR',light:true,desc:'Centang format yang ingin dibuka otomatis dengan WinRAR, misalnya <b>RAR</b> dan <b>ZIP</b>. Aktifkan juga <i>Integrate WinRAR into shell</i> agar menu klik kanan tersedia, lalu klik <b>OK</b>.',screen:()=>setupWin(a,'WinRAR Setup · Associate',`<div>Associate WinRAR with:</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:.35em">${cb('RAR',1)}${cb('ZIP',1)}${cb('7z',0)}${cb('TAR',0)}</div>${cb('Integrate WinRAR into shell',1)}`,`<span class="dbtn def hit" data-next-hit>OK</span><span class="dbtn">Cancel</span>`)},
   {kicker:'Langkah 7 · Selesai',title:'WinRAR siap dipakai',light:true,desc:'Klik <b>Done</b>. Untuk memakainya, klik kanan sebuah file atau folder lalu pilih <i>Add to archive</i> (mengompres) atau <i>Extract Here</i> (mengekstrak).',tip:'WinRAR adalah perangkat lunak berlisensi dengan masa percobaan. Alternatif gratis: 7-Zip.',screen:()=>setupWin(a,'WinRAR Setup',`<b style="font-size:1.25em;color:#15803D">✓ Installation complete</b><div>Klik kanan file → <b>Extract Here</b> atau <b>Add to archive…</b></div>`,`<span class="dbtn def">Done</span>`)}];
  if(a.name==='Microsoft Office')return [dl(a),openF(a),uacS(a),
   {kicker:'Langkah 4 · Mengunduh dan memasang',title:'Tunggu pemasangan Office',light:true,dur:5200,desc:'Installer jenis <i>Click-to-Run</i> mengunduh komponen Office lewat internet lalu memasangnya. Ukurannya besar, jadi butuh koneksi stabil dan beberapa menit.',tip:'Untuk banyak komputer atau tanpa internet, administrator memakai <b>Office Deployment Tool</b> untuk mengunduh paket sekali lalu memasangnya secara offline.',screen:()=>setupWin(a,'Office',prog('<b>Installing Office</b><br>Please wait while Office is downloaded and installed.','Jangan matikan komputer selama proses berjalan.'),`<span class="dbtn">Cancel</span>`)},
   {kicker:'Langkah 5 · Selesai',title:'Office terpasang',light:true,desc:'Pesan <i>You\'re all set!</i> berarti pemasangan selesai. Word, Excel, dan PowerPoint kini tersedia di menu Start.',screen:()=>setupWin(a,'Office',`<b style="font-size:1.25em">You're all set! Office is installed now</b><div style="display:flex;gap:.6em">${gl({g:'W',col:'#2B579A'})}${gl({g:'X',col:'#217346'})}${gl({g:'P',col:'#C43E1C'})}</div><div>Cari <b>Word</b>, <b>Excel</b>, dan <b>PowerPoint</b> di menu Start.</div>`,`<span class="dbtn def hit" data-next-hit>Close</span>`)},
   {kicker:'Langkah 6 · Aktivasi',title:'Masuk dengan akun berlisensi',light:true,desc:'Buka Word untuk pertama kali dan masuk dengan akun Microsoft yang memiliki lisensi, misalnya langganan Microsoft 365, pembelian Office, atau akun sekolah yang mendapat lisensi pendidikan.',tip:'Tidak punya lisensi? Gunakan Office versi web atau LibreOffice yang gratis.',screen:()=>setupWin(a,'Word · Sign in to get started',`<div>Masuk dengan akun Microsoft yang memiliki lisensi Office.</div><div class="fieldv">nama@contoh.sch.id</div>`,`<span class="dbtn def hit" data-next-hit>Sign in</span><span class="dbtn">Cancel</span>`)},
   {kicker:'Langkah 7 · Terverifikasi',title:'Office teraktivasi',light:true,desc:'Status <i>Product Activated</i> muncul di <b>File → Account</b>. Office siap dipakai.',screen:()=>setupWin(a,'Word · Account',`<b style="font-size:1.25em;color:#15803D">✓ Product Activated</b><div>Lisensi aktif. Status bisa dicek kapan saja di File → Account.</div>`,`<span class="dbtn">Close</span>`)}];
  return [dl(a),openF(a),uacS(a),
   {kicker:'Langkah 4 · Pemasangan',title:'Chrome terpasang otomatis',light:true,dur:5000,desc:'<code>ChromeSetup.exe</code> adalah installer <i>online</i>: berkas kecil yang mengunduh Chrome terbaru saat dijalankan, jadi komputer harus tersambung internet.',tip:'Butuh installer offline (standalone) untuk komputer tanpa internet? Cari opsi "Chrome offline installer" di halaman resmi Google Chrome.',screen:()=>setupWin(a,'Google Chrome',prog('<b>Installing Google Chrome</b>','Downloading and installing…'),`<span class="dbtn">Cancel</span>`)},
   {kicker:'Langkah 5 · Pertama dibuka',title:'Jadikan browser utama',light:true,desc:'Chrome terbuka otomatis. Klik <b>Set as default</b> bila ingin Chrome membuka tautan secara bawaan. Login akun Google bersifat opsional, gunanya menyinkronkan bookmark.',screen:()=>`<div class="brw"><div class="addr"><span>chrome://welcome</span></div><div class="page"><h6>Welcome to Chrome</h6><div>Jadikan Chrome browser utama?</div><div style="display:flex;gap:.8em;align-items:center"><div class="dlbtn hit" data-next-hit>Set as default</div><div class="dbtn">Skip</div></div></div></div>`},
   {kicker:'Langkah 6 · Selesai',title:'Chrome siap dipakai',light:true,desc:'Ketik alamat situs atau kata kunci di <i>address bar</i>. Pembaruan Chrome berjalan otomatis di latar belakang.',tip:'Pengaturan lain ada di Settings → Apps → Default apps.',screen:()=>`<div class="brw"><div class="addr"><span>https://www.google.com</span></div><div class="page">${gl(a,'width:3.2em;height:3.2em;font-size:1.3em')}<h6>Chrome siap dipakai</h6><div>Ketik alamat atau kata kunci di address bar.</div></div></div>`}];
}
const Q3=[
 {q:'Fungsi utama aplikasi <b>WinRAR</b> adalah...',o:['Mengedit video','Mengompres dan mengekstrak berkas','Memutar musik','Mengatur jaringan Wi-Fi'],a:1,e:'WinRAR mengemas banyak file menjadi satu arsip yang lebih kecil (RAR, ZIP) dan mengekstraknya kembali.'},
 {q:'Ekstensi berkas installer aplikasi pada Windows yang paling umum adalah...',o:['.jpg dan .png','.exe dan .msi','.docx dan .xlsx','.mp3 dan .mp4'],a:1,e:'Installer Windows lazimnya berbentuk .exe atau .msi. Berkas lain seperti .jpg atau .docx bukan program.'},
 {q:'Cara mengetahui Windows <b>32-bit atau 64-bit</b> sebelum mengunduh aplikasi adalah...',o:['Settings → System → About, lihat System type','Menekan tombol Caps Lock','Membuka Recycle Bin','Mengganti wallpaper'],a:0,e:'Halaman About memuat System type. Pilih installer yang sesuai agar aplikasi berjalan baik.'},
 {q:'Sumber unduhan aplikasi yang paling aman adalah...',o:['Situs resmi pengembang aplikasi','Situs "gratis semua" tanpa identitas','Pesan berantai di media sosial','Flashdisk milik orang yang tidak dikenal'],a:0,e:'Situs resmi menyediakan berkas asli. Sumber lain berisiko berisi malware atau bundleware.'},
 {q:'Microsoft Office termasuk perangkat lunak...',o:['Berlisensi (berbayar atau langganan)','Open source murni','Hanya untuk Linux','Tanpa installer'],a:0,e:'Office adalah perangkat lunak komersial. Penggunaan sah membutuhkan lisensi, misalnya Microsoft 365 atau lisensi pendidikan. Alternatif gratisnya antara lain LibreOffice.'},
 {q:'Jendela <b>User Account Control</b> menanyakan izin saat installer dijalankan. Tindakan yang tepat adalah...',o:['Selalu klik No','Periksa penerbit, lalu klik Yes bila sumbernya terpercaya','Mematikan komputer','Mencabut kabel listrik'],a:1,e:'UAC melindungi sistem dari perubahan tanpa izin. Pastikan nama Verified publisher sesuai dengan pengembang aplikasi.'},
 {q:'Cara menghapus (uninstall) aplikasi dari Windows 11 adalah...',o:['Menghapus ikon di Desktop saja','Settings → Apps → Installed apps → Uninstall','Menekan tombol Delete pada keyboard','Memformat flashdisk'],a:1,e:'Menghapus shortcut tidak menghapus programnya. Gunakan Settings → Apps → Installed apps lalu pilih Uninstall.'},
 {q:'<code>ChromeSetup.exe</code> termasuk installer jenis...',o:['Online, mengunduh Chrome terbaru saat dijalankan','Offline yang berisi seluruh program','Driver audio','Sistem operasi'],a:0,e:'ChromeSetup.exe adalah installer kecil yang mengunduh komponen saat instalasi, sehingga membutuhkan internet.'},
 {q:'Alternatif gratis dan open source untuk Microsoft Office adalah...',o:['LibreOffice','WinRAR','Rufus','Device Manager'],a:0,e:'LibreOffice menyediakan pengolah kata, lembar kerja, dan presentasi yang gratis dan kompatibel dengan format Office.'}
];
let appIdx=0;
function mountApps(){
  const a=APPS[appIdx];
  mountStepper($('#sim3'),{title:'Simulasi instalasi '+a.name,steps:appSteps(a),tabs:APPS.map(x=>x.name),tab:appIdx,onTab:k=>{appIdx=k;mountApps()}});
}
routes['pertemuan-3']={lesson:true,
 html:()=>lessonShell({cls:'h3c',n:3,title:'Instalasi Aplikasi',minutes:90,nq:Q3.length,
  lead:'Pasang aplikasi standar yang dipakai sehari-hari: WinRAR, Microsoft Office, dan Google Chrome, dengan cara yang aman dan sesuai lisensi.',
  toc:[['p3-konsep','Konsep dasar'],['p3-animasi','Animasi instalasi'],['p3-panduan','Panduan per aplikasi'],['p3-aman','Aman dan legal'],['p3-latihan','Latihan soal']],
  body:`
  <section class="sec" id="p3-konsep"><div class="goals"><h3>Tujuan pembelajaran</h3><ul>
    <li>${I.check}Membedakan jenis lisensi perangkat lunak dan memilih sumber unduhan yang aman.</li>
    <li>${I.check}Memasang WinRAR, Microsoft Office, dan Google Chrome langkah demi langkah.</li>
    <li>${I.check}Menghapus aplikasi dengan benar dan menerapkan etika penggunaan lisensi.</li></ul></div>
    <h2 style="margin-top:36px">Konsep dasar</h2><p class="sub">Aplikasi adalah perangkat lunak untuk tugas tertentu, seperti mengetik, menjelajah web, atau mengompres file.</p>
    <div class="tbl"><table><thead><tr><th>Jenis lisensi</th><th>Artinya</th><th>Contoh</th></tr></thead><tbody>
      <tr><td>Freeware</td><td>Gratis dipakai, kode tidak terbuka</td><td>Google Chrome</td></tr>
      <tr><td>Open source</td><td>Gratis dan kode sumber terbuka</td><td>LibreOffice, 7-Zip</td></tr>
      <tr><td>Shareware / trial</td><td>Gratis dicoba selama masa tertentu, lalu perlu lisensi</td><td>WinRAR (masa percobaan 40 hari)</td></tr>
      <tr><td>Komersial / langganan</td><td>Berbayar sekali beli atau berlangganan</td><td>Microsoft Office</td></tr></tbody></table></div>
    <div class="grid3" style="margin-top:20px">
      <div class="tcard"><span class="num">SEBELUM MEMASANG</span><h3>Cek komputer</h3><ul><li>Windows 32-bit atau 64-bit</li><li>Ruang penyimpanan kosong</li><li>Koneksi internet bila online installer</li></ul></div>
      <div class="tcard"><span class="num">JENIS INSTALLER</span><h3>.exe dan .msi</h3><p>Installer online berukuran kecil dan mengunduh sisanya. Installer offline berisi semua berkas dan bisa dipakai tanpa internet.</p></div>
      <div class="tcard"><span class="num">SAAT MEMASANG</span><h3>Baca tiap layar</h3><p>Pilih <i>Custom install</i> bila ada, dan hilangkan centang program tambahan yang tidak dibutuhkan.</p></div></div>
  </section>

  <section class="sec" id="p3-animasi"><h2>Animasi instalasi aplikasi</h2><p class="sub">Pilih aplikasi pada tab, lalu ikuti prosesnya dari unduh sampai siap dipakai.</p><div id="sim3"></div></section>

  <section class="sec" id="p3-panduan"><h2>Panduan per aplikasi</h2><p class="sub">Ringkasan fungsi, kebutuhan, dan catatan penting untuk tiap aplikasi.</p>
    <div class="grid3">
      <div class="tcard" style="--hue:#8E3B9E"><span class="num">WINRAR</span><h3>Kompres dan ekstrak</h3><ul><li>Fungsi: membuat dan membuka arsip RAR, ZIP, dan format lain</li><li>Unduh: win-rar.com, pilih versi 64-bit atau 32-bit</li><li>Pakai: klik kanan file → <i>Add to archive</i> atau <i>Extract Here</i></li><li>Lisensi: masa percobaan, lalu beli. Gratis: 7-Zip</li></ul></div>
      <div class="tcard"><span class="num">MICROSOFT OFFICE</span><h3>Word, Excel, PowerPoint</h3><ul><li>Fungsi: dokumen, lembar kerja, dan presentasi</li><li>Kebutuhan: Windows 10/11, RAM 4 GB, akun Microsoft, dan lisensi</li><li>Pasang: office.com atau account.microsoft.com → <i>Install apps</i></li><li>Offline: Office Deployment Tool. Gratis: LibreOffice</li></ul></div>
      <div class="tcard"><span class="num">GOOGLE CHROME</span><h3>Browser web</h3><ul><li>Fungsi: menjelajah web dan menjalankan aplikasi web</li><li>Unduh: google.com/chrome</li><li>Installer online otomatis. Offline: cari opsi standalone di halaman resmi</li><li>Browser utama: Settings → Apps → Default apps</li></ul></div></div>
    <h3 style="font-size:18px;margin:30px 0 14px">Menghapus aplikasi (uninstall)</h3>
    <ol class="steps"><li><b>Buka Settings</b><span>Tekan <kbd>Win</kbd>+<kbd>I</kbd>.</span></li><li><b>Masuk ke Apps → Installed apps</b><span>Daftar semua aplikasi terpasang muncul beserta ukurannya.</span></li><li><b>Pilih menu ⋯ lalu Uninstall</b><span>Ikuti petunjuk penghapusan. Menghapus ikon di Desktop saja tidak menghapus programnya.</span></li></ol>
  </section>

  <section class="sec" id="p3-aman"><h2>Aman dan legal</h2><p class="sub">Dua kebiasaan yang membedakan pengguna komputer yang baik.</p>
    <div class="grid2">
      ${callout('bad','Hindari crack dan keygen','<p>Aplikasi bajakan melanggar hak cipta dan sering disisipi malware. Gunakan lisensi sah, versi gratis, atau alternatif open source.</p>')}
      ${callout('tip','Cek sebelum klik Next','<p>Pastikan alamat situs benar, penerbit di UAC sesuai, dan tidak ada program tambahan yang ikut tercentang.</p>')}
    </div>
  </section>

  <section class="sec" id="p3-latihan"><h2>Latihan soal</h2><p class="sub">${Q3.length} soal pilihan ganda dengan pembahasan.</p><div id="quiz3"></div></section>`})+pager(['pertemuan-2','Pertemuan 2 · Instalasi Driver'],['kelompok-acak','Buat kelompok acak']),
 mount:()=>{mountApps();mountQuiz($('#quiz3'),'pertemuan-3',Q3)}
};

/* ====================================================================
   KELOMPOK ACAK
   ==================================================================== */
const SAMPLE=['Andi','Budi','Citra','Dewi','Eko','Fajar','Gita','Hana','Indra','Joko','Kiki','Lina'];
const HUES=['var(--c1)','var(--c2)','var(--c3)','var(--accent)'];
routes['kelompok-acak']={
 html:()=>`
  <div class="wrap" style="padding-block:36px 8px"><div class="l-title"><span class="eyebrow">Menu</span><h1>Kelompok Acak</h1><p>Tempel daftar nama siswa, tentukan jumlah kelompok, lalu acak. Setiap nama muncul tepat satu kali.</p></div></div>
  <div class="wrap g-layout">
   <form class="panel" id="gForm" novalidate>
    <div class="field"><label for="gNames">Daftar nama (satu nama per baris)</label><textarea id="gNames" spellcheck="false" placeholder="Tulis atau tempel nama siswa"></textarea>
      <small id="gCount" aria-live="polite"></small></div>
    <div class="row"><button class="btn sm" type="button" id="gSample">Isi contoh</button><button class="btn sm" type="button" id="gClear">${I.trash}Bersihkan</button></div>
    <div class="field"><span class="lab" id="gModeLab">Cara membagi</span><div class="seg" role="radiogroup" aria-labelledby="gModeLab"><label><input type="radio" name="mode" value="groups" checked>Jumlah kelompok</label><label><input type="radio" name="mode" value="size">Anggota per kelompok</label></div></div>
    <div class="field"><label for="gNum" id="gNumLab">Jumlah kelompok</label><input type="number" id="gNum" min="1" max="50" value="4" inputmode="numeric"></div>
    <label class="check"><input type="checkbox" id="gLead" checked>Pilih ketua kelompok secara acak</label>
    <button class="btn primary" type="submit" style="justify-content:center">${I.shuffle}Acak kelompok</button>
    <div class="g-msg" id="gMsg" role="status"></div>
   </form>
   <div class="g-res" id="gRes"></div>
  </div>`,
 mount:()=>{
  const ta=$('#gNames'),num=$('#gNum'),res=$('#gRes'),msg=$('#gMsg'),cnt=$('#gCount');
  let last=null,usingSample=false;
  const saved=store.get('ri:names');
  if(saved&&saved.trim()){ta.value=saved}else{ta.value=SAMPLE.join('\n');usingSample=true}
  const parse=()=>{const seen=new Set(),out=[];let dup=0;ta.value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean).forEach(n=>{const k=n.toLowerCase();if(seen.has(k))dup++;else{seen.add(k);out.push(n)}});return{names:out,dup}};
  const updCount=()=>{const p=parse();cnt.textContent=p.names.length+' nama terbaca'+(p.dup?` · ${p.dup} nama kembar dilewati`:'')+(usingSample?' · ini nama contoh, ganti dengan daftar kelasmu':'')};
  const setMsg=(t,err)=>{msg.textContent=t||'';msg.className='g-msg'+(err?' err':'')};
  const empty=()=>{res.innerHTML=`<div class="g-empty">${I.users}<b style="color:var(--ink)">Hasil kelompok akan tampil di sini</b><span>Isi daftar nama, atur jumlah kelompok, lalu klik <b>Acak kelompok</b>.</span></div>`};
  const mode=()=>$('input[name=mode]:checked').value;
  const draw=(groups,withLead)=>{
    const total=groups.reduce((s,g)=>s+g.length,0);
    res.innerHTML=`<div class="g-bar"><div><b style="font-family:var(--font-display);font-size:20px">${groups.length} kelompok</b> <span class="g-note">· ${total} siswa</span></div>
      <div class="row"><button class="btn sm" type="button" id="gAgain">${I.shuffle}Acak ulang</button><button class="btn sm primary" type="button" id="gCopy">${I.copy}Salin hasil</button></div></div>
      <div class="g-grid">${groups.map((g,i)=>`<article class="gcard" style="--i:${i};--hue:${HUES[i%HUES.length]}"><header><b>Kelompok ${i+1}</b><span>${g.length} anggota</span></header><ul>${g.map((n,k)=>`<li>${withLead&&k===0?'<span class="lead">Ketua</span>':''}<span>${esc(n)}</span></li>`).join('')}</ul></article>`).join('')}</div>
      <p class="g-note">Hasil berubah setiap kali diacak. Catat atau salin hasil sebelum mengacak ulang.</p>`;
    $('#gAgain').addEventListener('click',run);
    $('#gCopy').addEventListener('click',copy);
  };
  const split=(names,withLead)=>{
    const n=names.length,v=Math.max(1,parseInt(num.value,10)||1);
    let g=mode()==='groups'?Math.min(v,n):Math.ceil(n/v);
    g=Math.max(1,Math.min(g,n));
    const sh=shuffle(names),base=Math.floor(n/g),extra=n%g,out=[];let p=0;
    for(let i=0;i<g;i++){const sz=base+(i<extra?1:0);out.push(sh.slice(p,p+sz));p+=sz}
    return out;
  };
  const run=()=>{
    const {names}=parse();
    if(names.length<2){setMsg('Masukkan minimal 2 nama, satu nama per baris.',true);return}
    const v=parseInt(num.value,10);
    if(!v||v<1){setMsg('Isi angka 1 atau lebih pada kolom jumlah.',true);return}
    setMsg('');
    const withLead=$('#gLead').checked;
    const groups=split(names,withLead);
    last={groups,withLead};
    const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(still){draw(groups,withLead);return}
    res.innerHTML=`<div class="g-empty"><b style="color:var(--ink)">Mengacak…</b><span>${names.length} nama sedang dibagi</span></div>`;
    setTimeout(()=>{if(document.getElementById('gRes')===res)draw(groups,withLead)},550);
  };
  const text=()=>last.groups.map((g,i)=>`Kelompok ${i+1}\n`+g.map((n,k)=>`${k+1}. ${n}${last.withLead&&k===0?' (ketua)':''}`).join('\n')).join('\n\n');
  const copy=async()=>{
    const t=text();let ok=false;
    try{await navigator.clipboard.writeText(t);ok=true}catch(e){
      try{const x=document.createElement('textarea');x.value=t;x.style.position='fixed';x.style.opacity='0';document.body.appendChild(x);x.select();ok=document.execCommand('copy');x.remove()}catch(e2){}
    }
    setMsg(ok?'Hasil kelompok disalin.':'Tidak bisa menyalin otomatis. Catat hasil dari layar.',!ok);
  };
  $('#gForm').addEventListener('submit',e=>{e.preventDefault();run()});
  ta.addEventListener('input',()=>{usingSample=false;store.set('ri:names',ta.value);updCount()});
  $('#gSample').addEventListener('click',()=>{ta.value=SAMPLE.join('\n');usingSample=true;updCount();setMsg('')});
  $('#gClear').addEventListener('click',()=>{ta.value='';usingSample=false;store.set('ri:names','');updCount();last=null;empty();setMsg('');ta.focus()});
  $$('input[name=mode]').forEach(r=>r.addEventListener('change',()=>{$('#gNumLab').textContent=mode()==='groups'?'Jumlah kelompok':'Jumlah anggota per kelompok';num.value=mode()==='groups'?4:3}));
  updCount();empty();
  if(usingSample){const g=split(parse().names,true);last={groups:g,withLead:true};draw(g,true)}
  else if(parse().names.length>=2){run()}
 }
};

/* ====== Mulai ====== */
route();
})();
</script>

</body>
</html>
